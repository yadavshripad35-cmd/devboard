<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevBoard</title>

  <style>
    * { box-sizing: border-box; margin: 0; font-family: Inter, Arial, sans-serif; }

    body {
      min-height: 100vh;
      color: #fff;
      background: linear-gradient(135deg, #160b2e, #4b1d78, #8b5cf6);
      padding: 40px;
    }

    .app {
      max-width: 1100px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .logo { font-size: 26px; font-weight: 700; }
    .logo span { color: #d8b4fe; }

    button {
      border: 0;
      padding: 11px 18px;
      border-radius: 10px;
      background: #fff;
      color: #5b21b6;
      font-weight: 600;
      cursor: pointer;
    }

    .welcome { margin-bottom: 25px; }
    .welcome h1 { font-size: 32px; margin-bottom: 8px; }
    .welcome p { color: #ddd0f5; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .column {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.15);
      padding: 18px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .column h3 { margin-bottom: 15px; }

    .task {
      background: rgba(255,255,255,.95);
      color: #24113f;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .task p { font-size: 14px; margin-bottom: 12px; }

    .tag {
      font-size: 11px;
      background: #ede9fe;
      color: #6d28d9;
      padding: 5px 8px;
      border-radius: 6px;
    }

    @media(max-width: 750px) {
      body { padding: 20px; }
      .board { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <div class="logo">⚡ Dev<span>Board</span></div>
      <button>+ New Task</button>
    </header>

    <section class="welcome">
      <h1>Developer Task Board</h1>
      <p>Plan, build and ship your work.</p>
    </section>

    <main class="board">

      <div class="column">
        <h3>📋 To Do</h3>
        <div class="task">
          <p>Setup CI/CD pipeline</p>
          <span class="tag">DevOps</span>
        </div>
        <div class="task">
          <p>Create AWS infrastructure</p>
          <span class="tag">AWS</span>
        </div>
      </div>

      <div class="column">
        <h3>⚙️ In Progress</h3>
        <div class="task">
          <p>Dockerize application</p>
          <span class="tag">Docker</span>
        </div>
      </div>

      <div class="column">
        <h3>✅ Done</h3>
        <div class="task">
          <p>Setup Git repository</p>
          <span class="tag">Git</span>
        </div>
      </div>

    </main>
  </div>
</body>
</html>
